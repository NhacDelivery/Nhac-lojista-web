name: E2E lojista

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'src/pages/pedidos/**'
      - 'src/services/api.ts'
      - 'src/validators/statusPedido.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-lojista-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nhac_e2e
          MARIADB_USER: nhac_e2e
          MARIADB_PASSWORD: nhac_e2e
          MARIADB_ROOT_PASSWORD: nhac_e2e_root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout painel
        uses: actions/checkout@v4
        with:
          path: Nhac-lojista-web

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: NhacDelivery/backend-nhac
          ref: main
          path: backend-nhac

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend-nhac/pom.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nhac-lojista-web/package-lock.json

      - name: Instalar dependências
        working-directory: Nhac-lojista-web
        run: npm ci

      - name: Instalar Chromium
        working-directory: Nhac-lojista-web
        run: npx playwright install --with-deps chromium

      - name: Iniciar backend E2E
        working-directory: backend-nhac
        env:
          E2E_DB_URL: jdbc:mariadb://127.0.0.1:3307/nhac_e2e?serverTimezone=UTC&rewriteBatchedStatements=true
          E2E_DB_USER: nhac_e2e
          E2E_DB_PASSWORD: nhac_e2e
        run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=e2e > backend-e2e.log 2>&1 &

      - name: Aguardar backend
        run: |
          for i in {1..120}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' && exit 0
            sleep 1
          done
          tail -n 200 backend-nhac/backend-e2e.log
          exit 1

      - name: Iniciar painel
        working-directory: Nhac-lojista-web
        env:
          REACT_APP_API_URL: http://127.0.0.1:8080/api/v1
          BROWSER: none
        run: npm start > web-e2e.log 2>&1 &

      - name: Aguardar painel
        run: |
          for i in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/login > /dev/null && exit 0
            sleep 1
          done
          tail -n 200 Nhac-lojista-web/web-e2e.log
          exit 1

      - name: Executar E2E
        working-directory: Nhac-lojista-web
        env:
          RUN_E2E: 'true'
          E2E_WEB_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lojista-${{ github.run_number }}
          path: |
            Nhac-lojista-web/playwright-report
            Nhac-lojista-web/test-results
            Nhac-lojista-web/web-e2e.log
            backend-nhac/backend-e2e.log
          if-no-files-found: warn
          retention-days: 14
